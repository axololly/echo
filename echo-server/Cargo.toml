[package]
name = "echo-server"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
bitcode = "0.6.9"
chrono = "0.4.45"
dashmap = "6.2.1"
echo-server-derive = { path = "../echo-server-derive" }
echo-tasks = { path = "../echo-tasks" }
echo-types = { path = "../echo-types" }
file_type = "0.9.0"
p256 = "0.14.0"
quinn = "0.11.12"
rand = "0.10.4"
regex = "1.13.1"
rootcause = "0.13.0"
serde = "1.0.229"
sqlx = { version = "0.9.0", features = ["chrono", "postgres", "runtime-tokio"] }
structdiff = { version = "0.7.3", features = ["serde"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
vodozemac = "0.11.1"
