[package]
name = "echo-server"
version = "0.1.0"
edition = "2024"

[dependencies]
akd = { version = "0.13.0", features = ["serde_serialization"] }
async-trait = "0.1.92"
bitcode = { version = "0.6.9", features = ["serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
crypto_box = { version = "0.9.1", features = ["chacha20", "serde"] }
echo-akd = { path = "../echo-akd" }
echo-server-derive = { path = "../echo-server-derive" }
echo-types = { path = "../echo-types" }
quinn = "0.11.11"
rand = "0.10.2"
rootcause = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["chrono", "postgres"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
vodozemac = "0.10.0"
