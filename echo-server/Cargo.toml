[package]
name = "echo-server"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
bitcode = "0.6.9"
chrono = "0.4.45"
echo-server-derive = { path = "../echo-server-derive" }
echo-types = { path = "../echo-types" }
quinn = "0.11.12"
rootcause = "0.13.0"
serde = "1.0.229"
sqlx = { version = "0.9.0", features = ["chrono", "postgres", "runtime-tokio"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
