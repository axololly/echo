[package]
name = "echo-types"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = { version = "0.6.0", features = ["zeroize"] }
bitcode = { version = "0.6.9", features = ["serde"] }
blake3 = "1.8.7"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
chrono = { version = "0.4.45", features = ["serde"] }
ferroid = { version = "2.0.0", features = ["serde", "snowflake", "std"] }
hex = "0.4.3"
hkdf = { version = "0.13.0", features = ["kdf"] }
p256 = { version = "0.14.0", features = ["serde", "ecdh"] }
rand = "0.10.3"
rootcause = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = { version = "0.11.0", features = ["zeroize"] }
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio"] }
thiserror = "2.0.21"
vodozemac = "0.11.1"
