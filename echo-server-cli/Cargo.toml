[package]
name = "echo-server-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
echo-server = { path = "../echo-server" }
rootcause = "0.13.0"
rustls-pki-types = "1.16.0"
sqlx = { version = "0.9.0", features = ["postgres"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
