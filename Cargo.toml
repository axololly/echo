[package]
name = "echo-prototypes"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
bitcode = { version = "0.6.9", features = ["serde"] }
chacha20poly1305 = "0.11.0"
ferroid = { version = "2.0.0", features = ["serde", "snowflake", "std"] }
hkdf = { version = "0.13.0", features = ["kdf"] }
p256 = { version = "0.14.0", features = ["ecdh", "serde"] }
rand = "0.10.3"
rootcause = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["chrono", "postgres"] }
thiserror = "2.0.21"
vodozemac = "0.11.1"
